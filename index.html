<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manchas - Classroom Quiet Monitor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@300..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="sleeping-animation.css">
</head>
<body>
    <div class="fullscreen-container" id="fullscreenContainer">
        <!-- Top Right Timer -->
        <div class="timer-container" id="timerContainer">
            <div class="timer-badge">
                <span class="timer-badge-dot"></span>
                <span class="timer-label" id="timerLabel">Quiet Time</span>
            </div>
            <div class="timer-display" id="timerDisplay">00:00</div>
        </div>

        <!-- Center Speech Bubble Message -->
        <div class="message quiet" id="message">Click 'Start' to begin!</div>
        
        <!-- Center Mascot -->
        <div class="mascot-container">
            <img class="mascot sleeping" id="mascot" src="sleeping.png" alt="Manchas the Mascot"/>
            <div class="mascot-shadow"></div>
        </div>

        <!-- Sleep Zzz Particles Animation -->
        <div class="sleep-animation-container" id="sleepAnimation">
            <div class="z-letter">Z</div>
            <div class="z-letter">Z</div>
            <div class="z-letter">Z</div>
            <div class="z-letter">Z</div>
            <div class="z-letter">Z</div>
            <div class="z-letter">Z</div>
        </div>
    </div>

    <!-- Floating Toggle Button for Controls Drawer -->
    <div class="controls-toggle-container">
        <button class="controls-toggle-btn" id="controlsToggleBtn" aria-expanded="false" aria-controls="controlsPanel" title="Settings (C or S)">
            <svg class="toggle-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                <line x1="4" y1="21" x2="4" y2="14"></line>
                <line x1="4" y1="10" x2="4" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12" y2="3"></line>
                <line x1="20" y1="21" x2="20" y2="16"></line>
                <line x1="20" y1="12" x2="20" y2="3"></line>
                <line x1="1" y1="14" x2="7" y2="14"></line>
                <line x1="9" y1="8" x2="15" y2="8"></line>
                <line x1="17" y1="16" x2="23" y2="16"></line>
            </svg>
            <span class="toggle-text">Controls</span>
        </button>
    </div>

    <!-- Floating Controls Panel Drawer -->
    <aside class="controls-panel collapsed" id="controlsPanel" aria-label="Classroom Controls">
        <div class="controls-header">
            <div class="controls-title">
                <svg class="header-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="4" y1="21" x2="4" y2="14"></line>
                    <line x1="4" y1="10" x2="4" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="12"></line>
                    <line x1="12" y1="8" x2="12" y2="3"></line>
                    <line x1="20" y1="21" x2="20" y2="16"></line>
                    <line x1="20" y1="12" x2="20" y2="3"></line>
                    <line x1="1" y1="14" x2="7" y2="14"></line>
                    <line x1="9" y1="8" x2="15" y2="8"></line>
                    <line x1="17" y1="16" x2="23" y2="16"></line>
                </svg>
                <span>Settings</span>
            </div>
            <button class="controls-close-btn" id="controlsCloseBtn" aria-label="Hide settings" title="Hide settings (Esc)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <div class="controls-body">
            <!-- Mic Sensitivity -->
            <div class="control-group">
                <div class="control-label-row">
                    <label class="control-label" for="sensitivitySlider">🎤 Mic Sensitivity</label>
                    <span class="slider-value" id="sensitivityValue">90</span>
                </div>
                <div class="slider-container">
                    <span class="slider-minmax">Low</span>
                    <input type="range" class="slider" id="sensitivitySlider" min="50" max="90" value="90">
                    <span class="slider-minmax">High</span>
                </div>
                <div class="control-hint">Higher = Manchas wakes up more easily</div>
            </div>
            
            <!-- Live Volume Level -->
            <div class="control-group">
                <div class="control-label-row">
                    <label class="control-label">
                        📊 Live Noise Level
                    </label>
                    <span class="volume-status-dot green" id="volumeStatusDot"></span>
                </div>
                <div class="volume-meter" id="volumeMeter"></div>
            </div>

            <!-- Background Music -->
            <div class="control-group">
                <label class="control-label" for="trackSelect">🎵 Ambient Music</label>
                <div class="music-controls">
                    <div class="select-wrapper">
                        <select class="track-select" id="trackSelect">
                            <option value="">No music</option>
                            <optgroup label="Lo-Fi Beats">
                                <option value="lofi-1">Lo-Fi Chill</option>
                                <option value="lofi-2">Lo-Fi Study Beats</option>
                                <option value="lofi-3">Midnight Club</option>
                            </optgroup>
                            <optgroup label="Piano">
                                <option value="piano-1">Soft Piano Reverie</option>
                            </optgroup>
                        </select>
                    </div>
                    <button class="music-play-button" id="musicPlayButton" disabled aria-label="Play music" title="Play music">▶</button>
                </div>
                <div class="slider-container music-volume">
                    <span class="volume-icon">🔈</span>
                    <input type="range" class="slider" id="musicVolumeSlider" min="0" max="100" value="40">
                    <span class="volume-icon">🔊</span>
                </div>
                <div class="music-status" id="musicStatus"></div>
            </div>

            <!-- Timer Settings -->
            <div class="control-group">
                <label class="control-label">⏱️ Timer Options</label>
                <div class="toggle-row">
                    <label class="switch">
                        <input type="checkbox" id="timerVisibleToggle" checked>
                        <span class="switch-slider"></span>
                    </label>
                    <span class="toggle-label-text">Show timer on screen</span>
                </div>
                <div class="toggle-row">
                    <label class="switch">
                        <input type="checkbox" id="timerModeToggle">
                        <span class="switch-slider"></span>
                    </label>
                    <span class="toggle-label-text" id="timerModeLabel">Counting up</span>
                </div>
                <div class="slider-container countdown-duration" id="countdownDurationRow">
                    <span class="countdown-label">Target:</span>
                    <input type="number" class="countdown-input" id="countdownMinutes" min="1" max="60" value="10">
                    <span>min</span>
                </div>
            </div>

            <!-- Fullscreen Shortcut -->
            <div class="control-group control-group-footer">
                <button class="fullscreen-action-btn" id="fullscreenToggleBtn" title="Toggle Fullscreen (F)">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                    </svg>
                    <span id="fullscreenBtnText">Toggle Fullscreen</span>
                </button>
            </div>
        </div>
    </aside>

    <!-- Start / Stop Action Button -->
    <div class="start-button-container">
        <button class="start-button" id="startButton" aria-label="Start Quiet Time" title="Start Quiet Time (Space)">
            <span class="start-button-icon" id="startButtonIcon">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
                    <polygon points="6 3 20 12 6 21 6 3"></polygon>
                </svg>
            </span>
            <span class="start-button-text" id="startButtonText">Start</span>
        </button>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
