<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Quiet Monitor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@300..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="sleeping-animation.css">
    
</head>
<body>
    <div class="fullscreen-container ghost" id="fullscreenContainer">
        <!-- Timer -->
        <div class="timer-container" id="timerContainer">
            <div class="timer-label" id="timerLabel">Quiet Time</div>
            <div class="timer-display" id="timerDisplay">00:00</div>
        </div>

        <!-- Center Message -->
        <div class="message quiet" id="message">'Click 'Start Monitoring' to begin!'</div>
        
        <!-- Center Mascot -->
        <div class="mascot-container">
          <img class="mascot sleeping" id="mascot" src="sleeping.png" alt="Mascot"/>
          <div class="mascot-shadow"></div>
        </div>

        <div class="sleep-animation-container" id="sleepAnimation">
          <div class="z-letter">Z</div>
          <div class="z-letter">Z</div>
          <div class="z-letter">Z</div>
          <div class="z-letter">Z</div>
          <div class="z-letter">Z</div>
          <div class="z-letter">Z</div>
        </div>
    </div>

         <!-- Top Left Controls -->
        <div class="controls-left">
            <div class="control-group">
                <label class="control-label">🎤 Mic Sensitivity</label>
                <div class="slider-container">
                    <span>Low</span>
                    <input type="range" class="slider" id="sensitivitySlider" min="50" max="90" value="90">
                    <span>High</span>
                    <div class="slider-value" id="sensitivityValue">90</div>
                </div>
            </div>
            
            <div class="control-group">
                <label class="control-label">
                    📊 Volume Level
                    <span class="volume-status-dot green" id="volumeStatusDot"></span>
                </label>
                <div class="volume-meter" id="volumeMeter"></div>
            </div>

            <div class="control-group">
                <label class="control-label">🎵 Background Music</label>
                <div class="music-controls">
                    <select class="track-select" id="trackSelect">
                        <option value="">No music</option>
                        <optgroup label="Lo-Fi Beats">
                            <option value="lofi-1">Lo-Fi Chill</option>
                            <option value="lofi-2">Lo-Fi Study Beats</option>
                            <option value="lofi-3">Midnight Club</option>
                        </optgroup>
                        <optgroup label="Piano">
                            <option value="piano-1">Soft Piano Reverie</option>
                        </optgroup>
                    </select>
                    <button class="music-play-button" id="musicPlayButton" disabled aria-label="Play music">▶</button>
                </div>
                <div class="slider-container music-volume">
                    <span>🔈</span>
                    <input type="range" class="slider" id="musicVolumeSlider" min="0" max="100" value="40">
                    <span>🔊</span>
                </div>
                <div class="music-status" id="musicStatus"></div>
            </div>

            <div class="control-group">
                <label class="control-label">⏱️ Timer</label>
                <div class="toggle-row">
                    <label class="switch">
                        <input type="checkbox" id="timerVisibleToggle" checked>
                        <span class="switch-slider"></span>
                    </label>
                    <span>Show timer</span>
                </div>
                <div class="toggle-row">
                    <label class="switch">
                        <input type="checkbox" id="timerModeToggle">
                        <span class="switch-slider"></span>
                    </label>
                    <span id="timerModeLabel">Counting up</span>
                </div>
                <div class="slider-container countdown-duration" id="countdownDurationRow">
                    <span>Set:</span>
                    <input type="number" class="countdown-input" id="countdownMinutes" min="1" max="60" value="10">
                    <span>min</span>
                </div>
            </div>
        </div>
    <!-- Start Button -->
    <div class="start-button-container">
        <button class="start-button" id="startButton"></button>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
